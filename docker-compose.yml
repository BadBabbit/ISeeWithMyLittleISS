services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - react
      - flask

  react:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  flask:
    build:
      context: .
      dockerfile: backend/dockerfile
    volumes:
    - ./backend:/app/backend
    ports:
      - "5000:5000"
    environment:
    - FLASK_DEBUG=true
