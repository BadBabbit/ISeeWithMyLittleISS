iss:
  api:
    url: "https://api.wheretheiss.at/v1"
    timeout: 10
    rate_limit: 30

log:
  file:
    name: "logs/iseeiss.log"
    level: "INFO"
    max_bytes: 1048576
    formatter: "default"
  console:
    level: "DEBUG"
    stream: "ext://sys.stdout"
    formatter: "default"
  format: "[%(asctime)s] %(levelname)s in %(module)s: %(message)s"
